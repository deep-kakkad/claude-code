name: NIFTY EMA Crossover Strategy

on:
  schedule:
    # Every 5 minutes, Mon–Fri (GitHub Actions uses UTC)
    # IST 09:15–15:25 = UTC 03:45–09:55
    - cron: '45,50,55 3 * * 1-5'
    - cron: '*/5 4-8 * * 1-5'
    - cron: '0,5,10,15,20,25,30,35,40,45,50,55 9 * * 1-5'
  workflow_dispatch:   # allow manual trigger from GitHub UI

jobs:
  run-strategy:
    runs-on: ubuntu-latest
    timeout-minutes: 4   # must finish before next 5-min tick

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/beautiful-franklin-forTY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: dhan-algo/requirements.txt

      - name: Install dependencies
        run: pip install dhanhq yfinance certifi python-dotenv

      - name: Run EMA crossover strategy (dry-run)
        working-directory: dhan-algo
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
        run: |
          SSL_CERT_FILE=$(python -c "import certifi; print(certifi.where())") \
          PYTHONPATH=. python -c "
          import os, logging
          logging.basicConfig(level=logging.INFO,
              format='%(asctime)s %(levelname)-8s %(name)s: %(message)s',
              datefmt='%H:%M:%S')
          from workflows.ema_crossover_buy import EmaCrossoverWorkflow
          EmaCrossoverWorkflow(dry_run=True).run()
          "
